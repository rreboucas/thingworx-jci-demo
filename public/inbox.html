<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mailwave — Inbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/inbox.css" />
</head>
<body>
  <!-- Top bar -->
  <header class="mw-topbar">
    <div class="mw-topbar__left">
      <button class="mw-icon-btn" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="#5f6368" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="mw-brand">
        <img src="/assets/mailwave-logo.svg" alt="Mailwave" class="mw-brand__logo"/>
        <span class="mw-brand__name">Mailwave</span>
      </div>
    </div>

    <div class="mw-search">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" class="mw-search__icon">
        <circle cx="9" cy="9" r="6" stroke="#5f6368" stroke-width="2"/>
        <path d="M14 14l4 4" stroke="#5f6368" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input class="mw-search__input" placeholder="Search mail" />
      <button class="mw-icon-btn" aria-label="Filters">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 6h14M5 10h10M8 14h4" stroke="#5f6368" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="mw-topbar__right">
      <button class="mw-icon-btn" aria-label="Help"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="#5f6368" stroke-width="1.5"/><path d="M7.5 7.5a2.5 2.5 0 015 0c0 2-2.5 2-2.5 4M10 14h.01" stroke="#5f6368" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      <button class="mw-icon-btn" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.5" stroke="#5f6368" stroke-width="1.5"/><path d="M10 1.5v3M10 15.5v3M18.5 10h-3M4.5 10h-3M16 4l-2 2M6 14l-2 2M16 16l-2-2M6 6L4 4" stroke="#5f6368" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      <button class="mw-icon-btn" aria-label="Apps"><svg width="18" height="18" viewBox="0 0 20 20" fill="#5f6368"><circle cx="4" cy="4" r="1.6"/><circle cx="10" cy="4" r="1.6"/><circle cx="16" cy="4" r="1.6"/><circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="16" cy="10" r="1.6"/><circle cx="4" cy="16" r="1.6"/><circle cx="10" cy="16" r="1.6"/><circle cx="16" cy="16" r="1.6"/></svg></button>
      <div class="mw-avatar" title="Emily Thompson">ET</div>
    </div>
  </header>

  <div class="mw-shell">
    <!-- Sidebar -->
    <aside class="mw-sidebar">
      <button class="mw-compose">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 17l1.5-4.5L13 4l3 3L7.5 15.5 3 17z" fill="#0E9F8E" stroke="#0E9F8E" stroke-width="0.6" stroke-linejoin="round"/><path d="M11 6l3 3" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span>Compose</span>
      </button>

      <nav class="mw-nav">
        <a class="mw-nav__item is-active" href="#">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 7l7 5 7-5v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" stroke="currentColor" stroke-width="1.6"/><path d="M3 7l7-4 7 4" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>Inbox</span>
          <span class="mw-nav__count">14</span>
        </a>
        <a class="mw-nav__item" href="#">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 2l2.5 5.5 6 .5-4.5 4 1.4 6L10 14.8 4.6 18l1.4-6L1.5 8l6-.5L10 2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span>Starred</span>
        </a>
        <a class="mw-nav__item" href="#">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M10 6v4l3 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>Snoozed</span>
        </a>
        <a class="mw-nav__item" href="#">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M2 4l16 6-16 6 4-6-4-6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span>Sent</span>
        </a>
        <a class="mw-nav__item" href="#">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M5 3h7l3 3v11a1 1 0 01-1 1H5a1 1 0 01-1-1V4a1 1 0 011-1z" stroke="currentColor" stroke-width="1.4"/><path d="M12 3v3h3" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Drafts</span>
          <span class="mw-nav__count">2</span>
        </a>
        <a class="mw-nav__item" href="#">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>More</span>
        </a>
      </nav>

      <div class="mw-labels">
        <div class="mw-labels__head">Labels<span>+</span></div>
      </div>
    </aside>

    <!-- Inbox list -->
    <section class="mw-list">
      <div class="mw-list__toolbar">
        <input type="checkbox" class="mw-checkbox" />
        <button class="mw-icon-btn" aria-label="Refresh">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M16 5v4h-4M4 15v-4h4" stroke="#5f6368" stroke-width="1.6" stroke-linecap="round"/><path d="M16 9a6 6 0 00-10.5-2M4 11a6 6 0 0010.5 2" stroke="#5f6368" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="mw-icon-btn" aria-label="More">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="#5f6368"><circle cx="10" cy="5" r="1.4"/><circle cx="10" cy="10" r="1.4"/><circle cx="10" cy="15" r="1.4"/></svg>
        </button>
        <div class="mw-list__tabs">
          <button class="mw-list__tab is-active">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M3 7l7 5 7-5v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" stroke="#0E9F8E" stroke-width="1.6"/><path d="M3 7l7-4 7 4" stroke="#0E9F8E" stroke-width="1.6"/></svg>
            <span>Primary</span>
          </button>
          <button class="mw-list__tab">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M2 8h16M2 12h12" stroke="#5f6368" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>Promotions</span>
            <span class="mw-list__tab-badge">8 new</span>
          </button>
          <button class="mw-list__tab">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><circle cx="7" cy="8" r="3" stroke="#5f6368" stroke-width="1.4"/><circle cx="13" cy="11" r="3" stroke="#5f6368" stroke-width="1.4"/></svg>
            <span>Social</span>
          </button>
        </div>
        <div class="mw-list__pager">1–14 of many</div>
      </div>

      <ul class="mw-rows" id="mw-rows"><!-- inbox rows injected by inbox.js --></ul>
    </section>

    <!-- Preview pane -->
    <section class="mw-preview" id="mw-preview"><!-- email body injected by inbox.js --></section>
  </div>

  <!-- ============================================================
       Lodge Inn email body (template, used by inbox.js to render)
       ============================================================ -->
  <template id="mw-tpl-lodge-inn">
    <div class="mw-email">
      <header class="mw-email__toolbar">
        <button class="mw-icon-btn" aria-label="Back" onclick="history.back()">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="#5f6368" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="mw-icon-btn" aria-label="Archive"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 5h14v3H3zM4 8v8h12V8M8 11h4" stroke="#5f6368" stroke-width="1.5"/></svg></button>
        <button class="mw-icon-btn" aria-label="Trash"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M5 6h10M8 6V4h4v2M6 6l1 11h6l1-11" stroke="#5f6368" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        <button class="mw-icon-btn" aria-label="Spam"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="#5f6368" stroke-width="1.5"/><path d="M10 6v5M10 13.5v.5" stroke="#5f6368" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        <span class="mw-email__pager-spacer"></span>
        <span class="mw-email__pager">1 of 14</span>
      </header>

      <div class="mw-email__subject-row">
        <h1 class="mw-email__subject">Your Suite Upgrade is Confirmed — Welcome, Emily</h1>
        <span class="mw-email__label">Inbox</span>
      </div>

      <div class="mw-email__sender-row">
        <div class="mw-email__sender-avatar" style="background: linear-gradient(135deg, #0F2A44, #3F7E7C);">L</div>
        <div class="mw-email__sender-info">
          <div class="mw-email__sender-line">
            <strong>Lodge Inn by the Sea</strong>
            <span class="mw-email__sender-email">&lt;concierge@lodgeinnbythesea.com&gt;</span>
          </div>
          <div class="mw-email__sender-to">to me</div>
        </div>
        <div class="mw-email__date">10:24 AM (2 hours ago)</div>
        <button class="mw-icon-btn" aria-label="Star"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 2l2.5 5.5 6 .5-4.5 4 1.4 6L10 14.8 4.6 18l1.4-6L1.5 8l6-.5L10 2z" stroke="#5f6368" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
        <button class="mw-icon-btn" aria-label="Reply"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M9 5L4 10l5 5M4 10h8a4 4 0 014 4v2" stroke="#5f6368" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>

      <article class="mw-email__body">
        <!-- Hotel banner / hero -->
        <div class="li-hero">
          <img class="li-hero__bg" src="https://images.unsplash.com/photo-1571896349842-33c89424de2d?auto=format&fit=crop&w=1600&q=80" alt="Oceanfront resort at sunset" />
          <div class="li-hero__overlay"></div>
          <div class="li-hero__content">
            <div class="li-mark">
              <svg viewBox="0 0 40 40" width="38" height="38" aria-hidden="true">
                <rect x="17" y="6" width="6" height="20" fill="#E8DCC4" rx="1"/>
                <rect x="14" y="14" width="12" height="3" fill="#0F2A44"/>
                <rect x="14" y="19" width="12" height="3" fill="#0F2A44"/>
                <polygon points="20,2 14,8 26,8" fill="#E8DCC4"/>
                <rect x="11" y="26" width="18" height="2" fill="#E8DCC4"/>
                <rect x="9" y="28" width="22" height="3" fill="#3F7E7C"/>
                <path d="M8 31 Q20 35 32 31" stroke="#3F7E7C" stroke-width="1" fill="none"/>
              </svg>
            </div>
            <div class="li-wordmark">
              <span class="li-wordmark__top">LODGE INN</span>
              <span class="li-wordmark__divider"></span>
              <span class="li-wordmark__bottom">by the Sea</span>
            </div>
            <p class="li-tagline">Where the tide brings you home.</p>
          </div>
        </div>

        <!-- Greeting -->
        <div class="li-section">
          <p class="li-greeting">Dear Emily,</p>
          <p>
            Thank you for being a valued <strong>Platinum</strong> member of Lodge Inn by the Sea.
            We noticed you've been browsing suite availability for your upcoming stay,
            and as a thank-you for your loyalty, we'd be delighted to grant you a
            <strong>complimentary suite upgrade</strong> on us.
          </p>
        </div>

        <!-- Complimentary callout -->
        <div class="li-perk">
          <img class="li-perk__img" src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=1200&q=80" alt="Oceanfront suite interior" />
          <div class="li-perk__body">
            <span class="li-perk__pill">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="none" style="margin-right:6px;vertical-align:-2px;">
                <path d="M5 10l3 3 7-7" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              COMPLIMENTARY UPGRADE
            </span>
            <h3 class="li-perk__title">Oceanfront Suite</h3>
            <p class="li-perk__sub">Included with your reservation, on us — a thank-you for your continued loyalty.</p>
            <ul class="li-perk__features">
              <li>Private balcony with ocean views</li>
              <li>King bed &amp; expanded living area</li>
              <li>Welcome amenity from the concierge team</li>
            </ul>
          </div>
        </div>

        <!-- Activities transition -->
        <div class="li-section">
          <p>
            Based on your profile, we also thought you may enjoy these activities during your stay:
          </p>
        </div>

        <!-- Activities grid -->
        <div class="li-activities">
          <div class="li-card">
            <img class="li-card__img" src="https://images.unsplash.com/photo-1664922114319-4700c0ef74b1?auto=format&fit=crop&w=900&q=80" alt="Snorkeler underwater" />
            <div class="li-card__body">
              <h4 class="li-card__title">Guided Snorkeling Excursion</h4>
              <p class="li-card__meta">2 hours · Coral reef &amp; small group</p>
              <div class="li-card__footer">
                <span class="li-card__price">$129<span> / person</span></span>
                <a class="li-card__cta" href="#">Add to stay →</a>
              </div>
            </div>
          </div>

          <div class="li-card">
            <img class="li-card__img" src="https://images.unsplash.com/photo-1557151498-af2467d6f7f4?auto=format&fit=crop&w=900&q=80" alt="Paddle boarder on calm water" />
            <div class="li-card__body">
              <h4 class="li-card__title">Pedal Boarding Adventure</h4>
              <p class="li-card__meta">2 hours · Calm bay route</p>
              <div class="li-card__footer">
                <span class="li-card__price">$89<span> / person</span></span>
                <a class="li-card__cta" href="#">Add to stay →</a>
              </div>
            </div>
          </div>

          <div class="li-card">
            <img class="li-card__img" src="https://images.unsplash.com/photo-1601283261983-543e77949437?auto=format&fit=crop&w=900&q=80" alt="Paddle boarding at sunset" />
            <div class="li-card__body">
              <h4 class="li-card__title">Pedal Boarding Sunset Session</h4>
              <p class="li-card__meta">1 hour · Golden-hour glide</p>
              <div class="li-card__footer">
                <span class="li-card__price">$59<span> / person</span></span>
                <a class="li-card__cta" href="#">Add to stay →</a>
              </div>
            </div>
          </div>

          <div class="li-card">
            <img class="li-card__img" src="https://images.unsplash.com/photo-1544161515-4ab6ce6db874?auto=format&fit=crop&w=900&q=80" alt="Spa massage close-up" />
            <div class="li-card__body">
              <h4 class="li-card__title">Deep-Tissue Spa Treatment</h4>
              <p class="li-card__meta">45 minutes · Targeted relief massage</p>
              <div class="li-card__footer">
                <span class="li-card__price">$145<span> / person</span></span>
                <a class="li-card__cta" href="#">Add to stay →</a>
              </div>
            </div>
          </div>
        </div>

        <!-- Closing -->
        <div class="li-section">
          <p>
            Please let us know if there's anything else we can help with — we're delighted
            to welcome you back.
          </p>
          <p class="li-signoff">Warm regards,</p>
          <p class="li-signature">
            <strong>The Concierge Team</strong><br/>
            Lodge Inn by the Sea<br/>
            <span class="li-signature__muted">17 Driftwood Lane · lodgeinnbythesea.com</span>
          </p>
        </div>

        <!-- Footer / unsubscribe (faux) -->
        <div class="li-footer">
          You're receiving this because you're a Lodge Inn by the Sea loyalty member.
          <a href="#">Manage preferences</a> · <a href="#">Unsubscribe</a>
        </div>

        <!-- Reply chips -->
        <div class="mw-email__replies">
          <button class="mw-email__chip">Thank you!</button>
          <button class="mw-email__chip">I'll be there.</button>
          <button class="mw-email__chip">Add the snorkeling.</button>
        </div>
      </article>
    </div>
  </template>

  <!-- Decoy email "body" template -->
  <template id="mw-tpl-decoy">
    <div class="mw-email">
      <header class="mw-email__toolbar">
        <button class="mw-icon-btn" aria-label="Back">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="#5f6368" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </header>
      <div class="mw-decoy">
        <h2 data-slot="subject"></h2>
        <p data-slot="from"></p>
        <p class="mw-decoy__placeholder">This email's content would appear here. Click <strong>Lodge Inn by the Sea</strong> in the inbox to view the featured message.</p>
      </div>
    </div>
  </template>

  <script src="/inbox.js"></script>
</body>
</html>
